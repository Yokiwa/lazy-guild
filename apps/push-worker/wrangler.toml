name = "lazy-guild-push"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lazy-guild"
# Replace with the id printed by `wrangler d1 create lazy-guild` (see docs/deploy.md)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Replace with the output of `pnpm --filter @lazy-guild/push-worker vapid` (see docs/deploy.md)
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:lazy-guild@example.com"
# The web app's origin, e.g. https://lazy-guild.pages.dev
ALLOWED_ORIGIN = "http://localhost:5173"

# Secret (never committed): wrangler secret put VAPID_PRIVATE_KEY
